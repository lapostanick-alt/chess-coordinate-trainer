<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chess Square Trainer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-active {
      animation: pulse-ring 1.8s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header Navigation -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-xl shadow-lg text-white">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <div>
          <h1 class="font-black text-lg leading-tight flex items-center gap-2">
            SquareTrainer <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/30 font-semibold">Audio & Visual</span>
          </h1>
        </div>
      </div>

      <!-- Mode Selector -->
      <div class="flex items-center gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button onclick="setTrainerMode('flashcard')" id="modeBtnFlashcard" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-play sm:mr-1"></i> Flashcard / Audio Drill
        </button>
        <button onclick="setTrainerMode('color')" id="modeBtnColor" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i class="fa-solid fa-palette sm:mr-1"></i> Color Quiz
        </button>
      </div>

      <!-- Voice Control Toggle -->
      <button id="toggleMicBtn" onclick="toggleVoiceRecognition()" class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full transition-all bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
        <i id="micIcon" class="fa-solid fa-microphone-slash text-slate-400"></i>
        <span id="micStatusText" class="hidden sm:inline">Voice Input: Off</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-4xl mx-auto w-full flex-1 p-4 sm:p-8 flex flex-col items-center justify-center space-y-6">

    <!-- Score & Stats Bar (Color Quiz Mode) -->
    <div id="statsBar" class="w-full max-w-md grid grid-cols-2 gap-4 hidden">
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center">
        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block">Score</span>
        <span id="scoreText" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center">
        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block">Streak</span>
        <span id="streakText" class="text-2xl font-black text-amber-400">0</span>
      </div>
    </div>

    <!-- Main Large Square Display Card -->
    <div id="squareCard" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-10 sm:p-14 shadow-2xl flex flex-col items-center justify-center text-center relative overflow-hidden transition-all duration-300">
      
      <!-- Light / Dark Indicator Pill (Only shown in color quiz or when revealed) -->
      <span id="squareTypeBadge" class="text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full bg-slate-800 text-slate-400 mb-4 border border-slate-700">
        Target Square
      </span>

      <!-- Ultra-Large Coordinate Text -->
      <h2 id="coordinateDisplay" class="text-8xl sm:text-9xl font-black tracking-tight text-white drop-shadow-md my-2">
        e4
      </h2>

      <!-- Audio Trigger Button -->
      <button onclick="speakCurrentSquare()" class="mt-4 p-3 rounded-full bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 transition flex items-center gap-2 text-xs font-semibold">
        <i class="fa-solid fa-volume-high text-base"></i> Read Aloud
      </button>

      <!-- Feedback Banner for Color Quiz -->
      <div id="feedbackBanner" class="absolute bottom-3 text-xs font-bold opacity-0 transition-opacity"></div>
    </div>

    <!-- Flashcard Controls (Visible in Flashcard mode) -->
    <div id="flashcardControls" class="w-full max-w-md flex flex-col space-y-4">
      <div class="flex items-center justify-between gap-3">
        <button onclick="previousSquare()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-2xl text-sm transition flex items-center justify-center gap-2 border border-slate-700">
          <i class="fa-solid fa-arrow-left"></i> Prev
        </button>
        <button id="autoPlayBtn" onclick="toggleAutoPlay()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
          <i id="autoPlayIcon" class="fa-solid fa-play"></i> <span id="autoPlayText">Auto Play</span>
        </button>
        <button onclick="nextSquare()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-2xl text-sm transition flex items-center justify-center gap-2 border border-slate-700">
          Next <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Auto Play Speed Slider -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
        <div class="flex justify-between text-xs text-slate-400">
          <span>Auto Interval:</span>
          <span id="intervalValue" class="text-indigo-400 font-bold">2.5s</span>
        </div>
        <input type="range" id="intervalInput" min="1" max="6" step="0.5" value="2.5" onchange="updateInterval(this.value)" class="w-full accent-indigo-500 bg-slate-800 h-2 rounded-lg appearance-none cursor-pointer">
      </div>
    </div>

    <!-- Color Quiz Buttons (Visible in Color mode) -->
    <div id="colorControls" class="w-full max-w-md grid grid-cols-2 gap-4 hidden">
      <button onclick="answerColor('light')" class="py-5 bg-slate-200 hover:bg-white text-slate-950 font-black rounded-2xl text-base shadow-lg transition active:scale-95 border-2 border-white">
        LIGHT SQUARE
      </button>
      <button onclick="answerColor('dark')" class="py-5 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow-lg transition active:scale-95 border-2 border-slate-700">
        DARK SQUARE
      </button>
    </div>

    <!-- Spoken Voice Recognition Status Banner -->
    <div id="voiceTranscriptContainer" class="w-full max-w-md bg-slate-900/60 border border-slate-800 p-3 rounded-2xl text-center text-xs text-slate-400 font-mono">
      <span class="text-slate-500">Voice Recognition Status:</span> <span id="transcriptText" class="text-indigo-400 font-semibold italic">Ready</span>
    </div>

  </main>

  <!-- Audio Synthesizer & Application Logic -->
  <script>
    // --- State Variables ---
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const ranks = ['1', '2', '3', '4', '5', '6', '7', '8'];
    
    let currentSquare = 'e4';
    let history = ['e4'];
    let historyIndex = 0;
    let trainerMode = 'flashcard'; // 'flashcard' or 'color'
    let autoPlayInterval = null;
    let intervalSeconds = 2.5;
    let score = 0;
    let streak = 0;
    let recognition = null;
    let isListening = false;

    // --- Sound Effects (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(130, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    // --- Core Operations ---
    function getRandomSquare() {
      const f = files[Math.floor(Math.random() * files.length)];
      const r = ranks[Math.floor(Math.random() * ranks.length)];
      return f + r;
    }

    function isSquareLight(sq) {
      const fileIdx = sq.charCodeAt(0) - 97;
      const rankIdx = parseInt(sq[1]) - 1;
      return (fileIdx + rankIdx) % 2 !== 0;
    }

    function setSquare(sq, speak = true) {
      currentSquare = sq;
      document.getElementById('coordinateDisplay').innerText = sq;
      
      const isLight = isSquareLight(sq);
      const badge = document.getElementById('squareTypeBadge');
      if (trainerMode === 'flashcard') {
        badge.innerText = `${isLight ? 'Light' : 'Dark'} Square`;
        badge.className = `text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full border mb-4 ${
          isLight ? 'bg-slate-200 text-slate-900 border-white' : 'bg-slate-800 text-slate-300 border-slate-700'
        }`;
      } else {
        badge.innerText = 'Target Square';
        badge.className = 'text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full bg-slate-800 text-slate-400 mb-4 border border-slate-700';
      }

      if (speak) speakCurrentSquare();
    }

    function speakCurrentSquare() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        // Spoken format: "e 4"
        const text = `${currentSquare[0]} ${currentSquare[1]}`;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function nextSquare() {
      const sq = getRandomSquare();
      history.push(sq);
      historyIndex = history.length - 1;
      setSquare(sq);
    }

    function previousSquare() {
      if (historyIndex > 0) {
        historyIndex--;
        setSquare(history[historyIndex]);
      }
    }

    function toggleAutoPlay() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        document.getElementById('autoPlayText').innerText = "Auto Play";
        document.getElementById('autoPlayIcon').className = "fa-solid fa-play";
        document.getElementById('autoPlayBtn').className = "flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30";
      } else {
        nextSquare();
        autoPlayInterval = setInterval(nextSquare, intervalSeconds * 1000);
        document.getElementById('autoPlayText').innerText = "Pause";
        document.getElementById('autoPlayIcon').className = "fa-solid fa-pause";
        document.getElementById('autoPlayBtn').className = "flex-1 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-amber-600/30";
      }
    }

    function updateInterval(val) {
      intervalSeconds = parseFloat(val);
      document.getElementById('intervalValue').innerText = `${intervalSeconds}s`;
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = setInterval(nextSquare, intervalSeconds * 1000);
      }
    }

    function setTrainerMode(mode) {
      trainerMode = mode;
      if (autoPlayInterval) toggleAutoPlay();

      document.getElementById('modeBtnFlashcard').className = mode === 'flashcard' ? "px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow" : "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300";
      document.getElementById('modeBtnColor').className = mode === 'color' ? "px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow" : "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300";

      document.getElementById('flashcardControls').classList.toggle('hidden', mode !== 'flashcard');
      document.getElementById('colorControls').classList.toggle('hidden', mode !== 'color');
      document.getElementById('statsBar').classList.toggle('hidden', mode !== 'color');

      nextSquare();
    }

    function answerColor(chosenColor) {
      const actualIsLight = isSquareLight(currentSquare);
      const isCorrect = (chosenColor === 'light' && actualIsLight) || (chosenColor === 'dark' && !actualIsLight);

      if (isCorrect) {
        playSound('correct');
        score += 10;
        streak += 1;
        showFeedback("CORRECT!", "text-emerald-400");
      } else {
        playSound('error');
        streak = 0;
        showFeedback(`WRONG! (${actualIsLight ? 'Light' : 'Dark'})`, "text-red-400");
      }

      document.getElementById('scoreText').innerText = score;
      document.getElementById('streakText').innerText = streak;
      setTimeout(nextSquare, 800);
    }

    function showFeedback(msg, colorClass) {
      const banner = document.getElementById('feedbackBanner');
      banner.innerText = msg;
      banner.className = `absolute bottom-3 text-xs font-black tracking-wider transition-opacity duration-200 opacity-100 ${colorClass}`;
      setTimeout(() => { banner.classList.add('opacity-0'); }, 700);
    }

    // --- Voice Recognition ---
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micStatusText').innerText = "Voice Input: Active";
        document.getElementById('micIcon').className = "fa-solid fa-microphone text-red-500";
        document.getElementById('toggleMicBtn').className = "flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full transition-all bg-red-500/20 border border-red-500/30 text-red-300 mic-active";
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micStatusText').innerText = "Voice Input: Off";
        document.getElementById('micIcon').className = "fa-solid fa-microphone-slash text-slate-400";
        document.getElementById('toggleMicBtn').className = "flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full transition-all bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700";
      };

      recognition.onresult = (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
        }

        if (finalTranscript) {
          const text = finalTranscript.toLowerCase().trim();
          document.getElementById('transcriptText').innerText = `"${text}"`;

          if (trainerMode === 'color') {
            if (text.includes('light') || text.includes('white')) answerColor('light');
            else if (text.includes('dark') || text.includes('black')) answerColor('dark');
          } else if (text.includes('next')) nextSquare();
        }
      };
    }

    function toggleVoiceRecognition() {
      if (!recognition) initSpeechRecognition();
      if (!recognition) return;
      if (isListening) recognition.stop();
      else recognition.start();
    }

    window.onload = function() {
      setSquare('e4');
    };
  </script>
</body>
</html>
